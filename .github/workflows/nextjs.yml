# Builds and deploys the Rós Madair documentation site to GitHub Pages.
# Docs content (content/docs/**) lives in this repository.
#
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub Pages serves this project under /<repo>; Next needs the basePath
    # at build time so asset URLs resolve.
    env:
      NEXT_PUBLIC_BASE_PATH: /ros-madair-docs
      # The 763k substrate (~1 GB) lives on Cloudflare R2 (custom domain, $0 egress,
      # verified 206 range + CORS for this origin) — too big for the 1 GB Pages site
      # limit. Only aonach763k/* fetches route here; everything else stays on Pages.
      NEXT_PUBLIC_DATA_HOST: https://r2.f-a-t.link
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # node 24 to match the lockfile's npm (npm 11) and the release workflow's
          # jobs — npm 20/npm10 reads the optional napi deps differently and `npm ci`
          # fails "Missing @emnapi/core from lock file".
          node-version: "24"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Source = GitHub Actions) on first deploy; relies on the
          # workflow's pages:write permission. If the token can't, enable it once in
          # Settings → Pages → Source: GitHub Actions.
          enablement: true

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      # Self-host the duckdb-wasm bundles and generate the live-demo Parquet
      # corpus into public/ (npm run build's prebuild does this too, but keep it
      # explicit in CI).
      - name: Prepare live-demo assets
        run: npm run copy-duckdb && npm run copy-ros-madair && npm run gen-data

      - name: Build with Next.js
        run: npx --no-install next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
